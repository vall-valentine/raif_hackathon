name: red-flag-detector

services:
  app:
    build: .
    ports:
      - "8787:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-}
      OPENROUTER_VERBOSITY: ${OPENROUTER_VERBOSITY:-}
      OPENROUTER_REASONING_ENABLED: ${OPENROUTER_REASONING_ENABLED:-}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-}
      OPENROUTER_REASONING_EXCLUDE: ${OPENROUTER_REASONING_EXCLUDE:-}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-}
      OPENROUTER_BUDGET_TOKENS: ${OPENROUTER_BUDGET_TOKENS:-}
      OPENROUTER_LOG_REQUEST: ${OPENROUTER_LOG_REQUEST:-}
      OPENROUTER_LOG_FULL_RESPONSE: ${OPENROUTER_LOG_FULL_RESPONSE:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      RED_FLAG_PROMPT_PATH: ${RED_FLAG_PROMPT_PATH:-}
      # HF-режим (опционально):
      # HF_TOKEN: ${HF_TOKEN:-}
    # HF-режим (опционально):
    # volumes:
    #   - model_cache:/app/model_cache
    command: uvicorn app.main:application --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: pyproject.toml

