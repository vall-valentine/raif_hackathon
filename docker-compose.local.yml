name: red-flag-detector

services:
  app:
    build: .
    ports:
      - "8787:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-}
      OPENROUTER_TWO_STAGE_ENABLED: ${OPENROUTER_TWO_STAGE_ENABLED:-}
      OPENROUTER_REVIEW_MODEL: ${OPENROUTER_REVIEW_MODEL:-}
      OPENROUTER_REVIEW_TIMEOUT_SECONDS: ${OPENROUTER_REVIEW_TIMEOUT_SECONDS:-}
      OPENROUTER_VERIFY_SSL: ${OPENROUTER_VERIFY_SSL:-}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-}
      OPENROUTER_THINKING_BUDGET: ${OPENROUTER_THINKING_BUDGET:-}
      OPENROUTER_REVIEW_MAX_TOKENS: ${OPENROUTER_REVIEW_MAX_TOKENS:-}
      OPENROUTER_REVIEW_THINKING_BUDGET: ${OPENROUTER_REVIEW_THINKING_BUDGET:-}
      OPENROUTER_PROVIDER_IGNORE: ${OPENROUTER_PROVIDER_IGNORE:-}
      OPENROUTER_PROVIDER_ONLY: ${OPENROUTER_PROVIDER_ONLY:-}
      OPENROUTER_PROVIDER_ORDER: ${OPENROUTER_PROVIDER_ORDER:-}
      OPENROUTER_PROVIDER_ALLOW_FALLBACKS: ${OPENROUTER_PROVIDER_ALLOW_FALLBACKS:-}
      OPENROUTER_PROVIDER_REQUIRE_PARAMETERS: ${OPENROUTER_PROVIDER_REQUIRE_PARAMETERS:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      RED_FLAG_PROMPT_PATH: ${RED_FLAG_PROMPT_PATH:-}
      RED_FLAG_INCLUDE_TRAIN_EXAMPLES: ${RED_FLAG_INCLUDE_TRAIN_EXAMPLES:-}
      RED_FLAG_TRAIN_EXAMPLES_PATH: ${RED_FLAG_TRAIN_EXAMPLES_PATH:-}
    command: uvicorn app.main:application --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: pyproject.toml
